<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KitFix Logo — Concepts</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 2rem;
    transition: background-color 0.3s, color 0.3s;
  }
  body.light { background: #f5f5f5; color: #333; }
  body.dark { background: #0A0A0B; color: #E8E8E3; }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 2rem;
    flex-wrap: wrap;
    gap: 1rem;
  }
  h1 { font-size: 1.5rem; font-weight: 600; }
  h1 span { color: #00E859; }
  .toggle {
    padding: 0.5rem 1rem;
    border: 1px solid currentColor;
    border-radius: 6px;
    background: transparent;
    color: inherit;
    cursor: pointer;
    font-size: 0.875rem;
  }
  .subtitle {
    width: 100%;
    font-size: 0.875rem;
    opacity: 0.6;
    margin-top: -0.5rem;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(460px, 1fr));
    gap: 1.5rem;
  }
  .card {
    border: 1px solid rgba(128, 128, 128, 0.3);
    border-radius: 12px;
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .card:hover {
    border-color: #00E859;
  }
  .card-img {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    min-height: 280px;
  }
  body.light .card-img { background: #fff; }
  body.dark .card-img { background: #111; }
  .card-img img {
    max-width: 100%;
    max-height: 240px;
  }
  .card-label {
    padding: 0.75rem 1rem;
    font-size: 0.875rem;
    font-weight: 500;
    border-top: 1px solid rgba(128, 128, 128, 0.3);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  body.light .card-label { background: #fafafa; }
  body.dark .card-label { background: #1a1a1a; }
  .badge {
    font-size: 0.7rem;
    padding: 2px 8px;
    border-radius: 4px;
    font-weight: 600;
  }
  .badge-green { background: #00E85920; color: #00E859; border: 1px solid #00E85930; }
  .badge-gold { background: #C8A95120; color: #C8A951; border: 1px solid #C8A95130; }
</style>
</head>
<body class="dark">
  <div class="header">
    <div>
      <h1>KitFix <span>Logo</span> — Concepts</h1>
      <p class="subtitle">4 directions · Pick your favourite or mix elements</p>
    </div>
    <button class="toggle" onclick="document.body.classList.toggle('dark'); document.body.classList.toggle('light'); this.textContent = document.body.classList.contains('dark') ? '☀️ Light' : '🌙 Dark';">☀️ Light</button>
  </div>
  <div class="grid">
    <div class="card">
      <div class="card-img">
        <img src="concepts/concept-1.svg" alt="The Stitch Mark">
      </div>
      <div class="card-label">
        <span>1 · The Stitch Mark</span>
        <span class="badge badge-green">Stitching K</span>
      </div>
    </div>
    <div class="card">
      <div class="card-img">
        <img src="concepts/concept-2.svg" alt="The Shield + Jersey">
      </div>
      <div class="card-label">
        <span>2 · The Shield + Jersey</span>
        <span class="badge badge-gold">Sports Crest</span>
      </div>
    </div>
    <div class="card">
      <div class="card-img">
        <img src="concepts/concept-3.svg" alt="The Lab Badge">
      </div>
      <div class="card-label">
        <span>3 · The Lab Badge</span>
        <span class="badge badge-green">Lab + Thread</span>
      </div>
    </div>
    <div class="card">
      <div class="card-img">
        <img src="concepts/concept-4.svg" alt="The Monogram">
      </div>
      <div class="card-label">
        <span>4 · The KF Monogram</span>
        <span class="badge badge-gold">Interlocking</span>
      </div>
    </div>
  </div>
</body>
</html>
