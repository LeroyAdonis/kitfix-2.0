<svg viewBox="0 0 1024 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="metalGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2A5A2A"/>
      <stop offset="50%" style="stop-color:#17351A"/>
      <stop offset="100%" style="stop-color:#0A1F0A"/>
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F2B01E"/>
      <stop offset="100%" style="stop-color:#FFD700"/>
    </linearGradient>
  </defs>

  <!-- Monogram approach: Scissors + Needle as a unified mark, wordmark separate -->
  <g id="monogram" transform="translate(80, 80)">
    <!-- Scissors forming a bold K -->
    <g id="scissors-mark">
      <!-- Single unified scissor shape as K -->
      <path d="M0 0 L0 280" fill="none" stroke="url(#metalGradient)" stroke-width="24" stroke-linecap="round"/>
      <path d="M0 120 L80 20" fill="none" stroke="url(#metalGradient)" stroke-width="20" stroke-linecap="round"/>
      <path d="M0 120 L80 220" fill="none" stroke="url(#metalGradient)" stroke-width="20" stroke-linecap="round"/>
      <!-- Pivot bolt -->
      <circle cx="0" cy="120" r="16" fill="url(#goldGradient)"/>
      <circle cx="0" cy="120" r="8" fill="#17351A"/>
    </g>
    
    <!-- Needle forming a separate graphic element (not letter) -->
    <g id="needle-mark" transform="translate(160, 40)">
      <path d="M10 0 L10 200" fill="none" stroke="url(#metalGradient)" stroke-width="12" stroke-linecap="round"/>
      <!-- Needle eye -->
      <ellipse cx="10" cy="25" rx="10" ry="5" fill="#EFE9D8" stroke="url(#metalGradient)" stroke-width="3"/>
      <!-- Thread loop -->
      <path d="M10 30 Q35 30 35 60 Q35 90 10 90" fill="none" stroke="url(#goldGradient)" stroke-width="8" stroke-linecap="round"/>
      <!-- Stitch marks along thread -->
      <g stroke="url(#goldGradient)" stroke-width="4" stroke-linecap="round">
        <line x1="10" y1="45" x2="25" y2="45"/>
        <line x1="10" y1="60" x2="28" y2="60"/>
        <line x1="10" y1="75" x2="25" y2="75"/>
      </g>
    </g>
  </g>

  <!-- Bold wordmark "KitFix" -->
  <g id="wordmark-bold" transform="translate(80, 380)">
    <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="160" font-weight="800" fill="#17351A" letter-spacing="-1">KitFix</text>
    <!-- Gold underline stitch -->
    <path d="M0 20 L480 20" fill="none" stroke="url(#goldGradient)" stroke-width="6" stroke-linecap="round" stroke-dasharray="20,10"/>
  </g>

  <!-- Subtle tagline -->
  <g id="tagline" transform="translate(80, 450)">
    <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#17351A" letter-spacing="2" opacity="0.6">JERSEY REPAIR • SOUTH AFRICA</text>
  </g>
</svg>