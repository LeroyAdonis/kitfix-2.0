<svg viewBox="0 0 1024 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2A5A2A"/>
      <stop offset="100%" style="stop-color:#17351A"/>
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F2B01E"/>
      <stop offset="100%" style="stop-color:#FFD700"/>
    </linearGradient>
  </defs>

  <!-- Minimal geometric approach - pure shapes, negative space -->
  <g id="minimal-mark" transform="translate(100, 80)">
    <!-- Scissor K as pure geometry - two intersecting paths -->
    <!-- Vertical bar -->
    <rect x="0" y="0" width="16" height="280" rx="8" fill="url(#greenGradient)"/>
    <!-- Upper diagonal -->
    <path d="M8 100 L88 10" fill="none" stroke="url(#greenGradient)" stroke-width="16" stroke-linecap="round"/>
    <!-- Lower diagonal -->
    <path d="M8 100 L88 190" fill="none" stroke="url(#greenGradient)" stroke-width="16" stroke-linecap="round"/>
    <!-- Pivot circle (gold) -->
    <circle cx="8" cy="100" r="14" fill="url(#goldGradient)"/>
    <!-- Negative space finger holes (knocked out) -->
    <circle cx="-16" cy="296" r="16" fill="#EFE9D8"/>
    <circle cx="32" cy="296" r="16" fill="#EFE9D8"/>
  </g>

  <!-- Wordmark: "itFix" with needle-i -->
  <g id="wordmark-minimal" transform="translate(240, 120)">
    <!-- "it" clean -->
    <text x="0" y="200" font-family="Helvetica, Arial, sans-serif" font-size="160" font-weight="600" fill="#17351A" letter-spacing="0">it</text>
    
    <!-- "F" -->
    <g transform="translate(100, 0)">
      <rect x="0" y="0" width="12" height="200" rx="6" fill="#17351A"/>
      <rect x="0" y="0" width="70" height="12" rx="6" fill="#17351A"/>
      <rect x="0" y="90" width="50" height="12" rx="6" fill="#17351A"/>
    </g>
    
    <!-- "i" formed by needle - minimal -->
    <g id="needle-i-minimal" transform="translate(190, -20)">
      <!-- Needle stem -->
      <rect x="5" y="0" width="10" height="180" rx="5" fill="url(#greenGradient)"/>
      <!-- Needle eye (negative space) -->
      <rect x="3" y="15" width="14" height="10" rx="5" fill="#EFE9D8"/>
      <!-- Thread dot (gold) -->
      <ellipse cx="10" cy="50" rx="12" ry="10" fill="url(#goldGradient)"/>
      <!-- Thread tail -->
      <path d="M10 60 Q25 75 20 100 Q15 125 25 140" fill="none" stroke="url(#goldGradient)" stroke-width="5" stroke-linecap="round" stroke-dasharray="10,6"/>
    </g>
    
    <!-- "x" -->
    <g transform="translate(270, 0)">
      <path d="M0 0 L50 200 M50 0 L0 200" fill="none" stroke="#17351A" stroke-width="14" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Single gold stitch line -->
  <path d="M100 350 L924 350" fill="none" stroke="url(#goldGradient)" stroke-width="3" stroke-linecap="round" stroke-dasharray="16,12"/>
</svg>