<svg viewBox="0 0 1024 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="stitchGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F2B01E"/>
      <stop offset="100%" style="stop-color:#FFD700"/>
    </linearGradient>
    <linearGradient id="bladeGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#17351A"/>
      <stop offset="100%" style="stop-color:#0A1F0A"/>
    </linearGradient>
  </defs>

  <!-- Scissors forming the "K" -->
  <g id="scissors-K" transform="translate(80, 120)">
    <!-- Left blade (vertical stroke of K) -->
    <path d="M0 0 L0 272 M0 272 L-24 296" fill="none" stroke="url(#bladeGradient)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right blade (diagonal upper stroke of K) -->
    <path d="M0 120 L60 40" fill="none" stroke="url(#bladeGradient)" stroke-width="16" stroke-linecap="round"/>
    <!-- Right blade (diagonal lower stroke of K) -->
    <path d="M0 120 L60 200" fill="none" stroke="url(#bladeGradient)" stroke-width="16" stroke-linecap="round"/>
    <!-- Pivot screw -->
    <circle cx="0" cy="120" r="12" fill="#17351A"/>
    <circle cx="0" cy="120" r="6" fill="#F2B01E"/>
    <!-- Finger holes (negative space suggestion) -->
    <circle cx="-30" cy="296" r="18" fill="none" stroke="#17351A" stroke-width="4"/>
    <circle cx="20" cy="296" r="18" fill="none" stroke="#17351A" stroke-width="4"/>
  </g>

  <!-- "itFix" wordmark -->
  <g id="wordmark-itFix" transform="translate(200, 0)">
    <!-- "it" -->
    <text x="0" y="300" font-family="Helvetica, Arial, sans-serif" font-size="200" font-weight="700" fill="#17351A" letter-spacing="2">it</text>
    
    <!-- "F" with needle forming the "i" -->
    <g transform="translate(110, 0)">
      <!-- F vertical stroke -->
      <path d="M0 0 L0 272" fill="none" stroke="#17351A" stroke-width="18" stroke-linecap="round"/>
      <!-- F top crossbar -->
      <path d="M0 0 L80 0" fill="none" stroke="#17351A" stroke-width="18" stroke-linecap="round"/>
      <!-- F middle crossbar -->
      <path d="M0 110 L60 110" fill="none" stroke="#17351A" stroke-width="16" stroke-linecap="round"/>
    </g>
    
    <!-- "ix" - the "i" formed by needle & thread -->
    <g id="needle-i" transform="translate(230, 20)">
      <!-- Needle body forming the "i" stem -->
      <path d="M10 0 L10 220" fill="none" stroke="url(#bladeGradient)" stroke-width="10" stroke-linecap="round"/>
      <!-- Needle eye -->
      <ellipse cx="10" cy="30" rx="8" ry="4" fill="#EFE9D8" stroke="#17351A" stroke-width="2"/>
      <!-- Thread coming from eye, curving to form the dot of "i" -->
      <path d="M10 34 Q30 34 30 60 Q30 86 10 86" fill="none" stroke="url(#stitchGradient)" stroke-width="6" stroke-linecap="round"/>
      <!-- Thread continuation -->
      <path d="M10 86 Q-10 110 -10 140" fill="none" stroke="url(#stitchGradient)" stroke-width="5" stroke-linecap="round" stroke-dasharray="8,4"/>
      <!-- Thread tail -->
      <path d="M-10 140 Q0 150 10 160" fill="none" stroke="url(#stitchGradient)" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    </g>
    
    <!-- "x" -->
    <g transform="translate(350, 0)">
      <path d="M0 0 L50 272 M50 0 L0 272" fill="none" stroke="#17351A" stroke-width="18" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Gold stitch accent line under wordmark -->
  <path d="M200 320 L824 320" fill="none" stroke="url(#stitchGradient)" stroke-width="4" stroke-linecap="round" stroke-dasharray="12,6"/>
</svg>