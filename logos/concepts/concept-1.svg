<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 512" width="1024" height="512">
  <defs>
    <style>
      .bg           { fill: #0A0A0B; }
      .stitch       { fill: none; stroke: #00E859; stroke-linecap: round; stroke-linejoin: round; }
      .stitch-hole  { fill: #00E859; }
      .needle       { fill: none; stroke: #C8A951; stroke-linecap: round; }
      .needle-hole  { fill: #0A0A0B; stroke: #C8A951; stroke-width: 1.5; }
      .txt-brand    { fill: #E8E8E3; font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 76px; }
      .txt-tagline  { fill: #00E859; font-family: system-ui, -apple-system, sans-serif; font-weight: 300; font-size: 18px; letter-spacing: 0.22em; font-variant: small-caps; }
    </style>
  </defs>

  <!-- Dark lab background -->
  <rect class="bg" width="1024" height="512"/>

  <!-- ====== STITCH MARK (left side) ====== -->
  <g id="stitch-mark">

    <!-- K — Vertical stem -->
    <path class="stitch" stroke-dasharray="9,7" stroke-width="5" d="M 160,80 L 160,432"/>
    <circle class="stitch-hole" cx="160" cy="80"  r="2.5"/>
    <circle class="stitch-hole" cx="160" cy="432" r="2.5"/>

    <!-- K — Upper diagonal arm -->
    <path class="stitch" stroke-dasharray="9,7" stroke-width="5" d="M 160,170 L 350,70"/>
    <circle class="stitch-hole" cx="350" cy="70" r="2.5"/>

    <!-- K — Lower diagonal arm -->
    <path class="stitch" stroke-dasharray="9,7" stroke-width="5" d="M 160,320 L 350,442"/>
    <circle class="stitch-hole" cx="350" cy="442" r="2.5"/>

    <!-- Subtle cross-stitch accents at the K joint -->
    <g class="stitch" stroke-width="2">
      <path d="M 148,200 L 172,210 M 148,210 L 172,200"/>
      <path d="M 148,300 L 172,310 M 148,310 L 172,300"/>
    </g>

    <!-- ====== REPAIR NEEDLE ====== -->
    <g id="repair-needle">
      <!-- Main shaft — pierces diagonally through the K -->
      <path class="needle" stroke-width="3.5" d="M 60,440 L 380,68"/>
      <!-- Tapered tip -->
      <path class="needle" stroke-width="2"    d="M 380,68 L 402,46"/>
      <path class="needle" stroke-width="0.8"  d="M 402,46 L 408,40"/>
      <!-- Needle eye (elliptical hole near the blunt end) -->
      <ellipse class="needle-hole" cx="66" cy="436" rx="9" ry="3.5" transform="rotate(-49, 66, 436)"/>
    </g>

  </g>

  <!-- ====== WORDMARK (right side) ====== -->
  <g id="wordmark">
    <text class="txt-brand"   x="470" y="225">KitFix</text>
    <text class="txt-tagline" x="472" y="290">JERSEY REPAIR LAB</text>
  </g>

</svg>
