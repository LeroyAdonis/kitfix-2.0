<svg viewBox="0 0 1024 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="threadGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F2B01E"/>
      <stop offset="50%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#F2B01E"/>
    </linearGradient>
    <filter id="fabricTexture" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feDiffuseLighting in="noise" lighting-color="#17351A" surfaceScale="3">
        <feDistantLight azimuth="45" elevation="60"/>
      </feDiffuseLighting>
      <feComposite in="SourceGraphic" in2="lighting" operator="arithmetic" k1="0" k2="1" k3="0" k4="0"/>
    </filter>
  </defs>

  <!-- Background fabric texture suggestion -->
  <rect width="1024" height="512" fill="#EFE9D8" filter="url(#fabricTexture)" opacity="0.15"/>

  <!-- Scissors forming "K" - more stylized, open scissors -->
  <g id="scissors-K" transform="translate(100, 150)">
    <!-- Left blade - vertical of K -->
    <g filter="url(#fabricTexture)">
      <path d="M0 0 L0 240" fill="none" stroke="#17351A" stroke-width="22" stroke-linecap="round"/>
      <!-- Blade edge highlight -->
      <path d="M4 0 L4 240" fill="none" stroke="#2A5A2A" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    </g>
    <!-- Upper diagonal of K -->
    <path d="M0 100 L70 20" fill="none" stroke="#17351A" stroke-width="18" stroke-linecap="round"/>
    <!-- Lower diagonal of K -->
    <path d="M0 100 L70 180" fill="none" stroke="#17351A" stroke-width="18" stroke-linecap="round"/>
    <!-- Pivot -->
    <circle cx="0" cy="100" r="14" fill="#17351A"/>
    <circle cx="0" cy="100" r="7" fill="url(#threadGradient)"/>
    <!-- Finger rings -->
    <ellipse cx="-35" cy="255" rx="22" ry="18" fill="none" stroke="#17351A" stroke-width="5"/>
    <ellipse cx="35" cy="255" rx="22" ry="18" fill="none" stroke="#17351A" stroke-width="5"/>
  </g>

  <!-- "itFix" with hand-drawn feel -->
  <g id="wordmark" transform="translate(220, 40)">
    <!-- Custom hand-drawn style lettering for "itFix" -->
    <g id="letter-i" transform="translate(0, 0)">
      <!-- Needle as the "i" stem - playful curved -->
      <path d="M15 30 Q15 15 25 15 Q35 15 35 30 L35 200 Q35 215 25 215 Q15 215 15 200 Z" fill="#17351A"/>
      <!-- Needle eye - cut out -->
      <ellipse cx="25" cy="50" rx="6" ry="3" fill="#EFE9D8"/>
      <!-- Thread as the dot of "i" - playful loop -->
      <path d="M25 53 Q45 53 45 73 Q45 93 25 93 Q5 93 5 73 Q5 53 25 53" fill="url(#threadGradient)"/>
      <!-- Thread tail curling -->
      <path d="M25 93 Q40 110 30 130 Q20 150 35 170" fill="none" stroke="url(#threadGradient)" stroke-width="5" stroke-linecap="round" stroke-dasharray="10,5"/>
    </g>
    
    <g id="letter-t" transform="translate(60, 0)">
      <path d="M0 0 L50 0 M25 0 L25 240" fill="none" stroke="#17351A" stroke-width="16" stroke-linecap="round"/>
    </g>
    
    <g id="letter-F" transform="translate(120, 0)">
      <path d="M0 0 L0 240 M0 0 L70 0 M0 100 L50 100" fill="none" stroke="#17351A" stroke-width="16" stroke-linecap="round"/>
    </g>
    
    <g id="letter-i2" transform="translate(200, 0)">
      <!-- Second "i" with thread stitching -->
      <path d="M15 30 L15 200" fill="none" stroke="#17351A" stroke-width="16" stroke-linecap="round"/>
      <!-- Thread dot -->
      <path d="M15 30 Q35 30 35 50 Q35 70 15 70 Q-5 70 -5 50 Q-5 30 15 30" fill="url(#threadGradient)"/>
    </g>
    
    <g id="letter-x" transform="translate(270, 0)">
      <path d="M0 0 L50 240 M50 0 L0 240" fill="none" stroke="#17351A" stroke-width="16" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Stitching line connecting everything - runs under the wordmark -->
  <path d="M100 330 Q200 310 300 330 Q400 350 500 330 Q600 310 700 330 Q800 350 924 330" 
        fill="none" stroke="url(#threadGradient)" stroke-width="5" stroke-linecap="round" stroke-dasharray="16,8"/>
  
  <!-- Small stitch marks along the line -->
  <g stroke="url(#threadGradient)" stroke-width="3" stroke-linecap="round">
    <line x1="150" y1="325" x2="150" y2="335"/>
    <line x1="250" y1="325" x2="250" y2="335"/>
    <line x1="350" y1="325" x2="350" y2="335"/>
    <line x1="450" y1="325" x2="450" y2="335"/>
    <line x1="550" y1="325" x2="550" y2="335"/>
    <line x1="650" y1="325" x2="650" y2="335"/>
    <line x1="750" y1="325" x2="750" y2="335"/>
    <line x1="850" y1="325" x2="850" y2="335"/>
  </g>
</svg>