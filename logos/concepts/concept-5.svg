<svg viewBox="0 0 1024 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="badgeGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2A5A2A"/>
      <stop offset="100%" style="stop-color:#17351A"/>
    </linearGradient>
    <linearGradient id="badgeGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F2B01E"/>
      <stop offset="100%" style="stop-color:#FFD700"/>
    </linearGradient>
    <linearGradient id="creamGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF8E8"/>
      <stop offset="100%" style="stop-color:#EFE9D8"/>
    </linearGradient>
  </defs>

  <!-- Badge/Crest style - established, trustworthy -->
  <g id="badge" transform="translate(80, 30)">
    <!-- Badge background shape -->
    <path d="M0 0 L400 0 Q430 0 430 30 L430 350 Q430 380 400 380 L0 380 Q-30 380 -30 350 L-30 30 Q-30 0 0 0" 
          fill="url(#creamGradient)" stroke="url(#badgeGreen)" stroke-width="4"/>
    
    <!-- Inner badge area -->
    <path d="M20 20 L380 20 Q400 20 400 40 L400 330 Q400 350 380 350 L20 350 Q0 350 0 330 L0 40 Q0 20 20 20" 
          fill="none" stroke="url(#badgeGold)" stroke-width="2" stroke-dasharray="8,4"/>
    
    <!-- Scissors forming K in center -->
    <g id="scissors-badge" transform="translate(100, 100)">
      <path d="M0 0 L0 180" fill="none" stroke="url(#badgeGreen)" stroke-width="18" stroke-linecap="round"/>
      <path d="M0 70 L55 10" fill="none" stroke="url(#badgeGreen)" stroke-width="14" stroke-linecap="round"/>
      <path d="M0 70 L55 130" fill="none" stroke="url(#badgeGreen)" stroke-width="14" stroke-linecap="round"/>
      <circle cx="0" cy="70" r="12" fill="url(#badgeGold)"/>
      <circle cx="0" cy="70" r="6" fill="#17351A"/>
      <circle cx="-20" cy="195" r="14" fill="none" stroke="url(#badgeGreen)" stroke-width="3"/>
      <circle cx="20" cy="195" r="14" fill="none" stroke="url(#badgeGreen)" stroke-width="3"/>
    </g>
    
    <!-- Needle with thread forming accent -->
    <g id="needle-badge" transform="translate(260, 120)">
      <path d="M10 0 L10 140" fill="none" stroke="url(#badgeGreen)" stroke-width="10" stroke-linecap="round"/>
      <ellipse cx="10" cy="20" rx="8" ry="4" fill="#FFF8E8" stroke="url(#badgeGreen)" stroke-width="2"/>
      <path d="M10 24 Q30 24 30 50 Q30 76 10 76" fill="none" stroke="url(#badgeGold)" stroke-width="6" stroke-linecap="round"/>
      <g stroke="url(#badgeGold)" stroke-width="3" stroke-linecap="round">
        <line x1="10" y1="34" x2="22" y2="34"/>
        <line x1="10" y1="44" x2="25" y2="44"/>
        <line x1="10" y1="54" x2="22" y2="54"/>
      </g>
    </g>
  </g>

  <!-- Wordmark below badge -->
  <g id="wordmark-badge" transform="translate(80, 430)">
    <text x="200" y="0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#17351A" letter-spacing="4">KITFIX</text>
    <text x="200" y="35" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#17351A" letter-spacing="8" opacity="0.7">JERSEY REPAIR</text>
  </g>

  <!-- Established date -->
  <g id="established" transform="translate(550, 380)">
    <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#17351A" letter-spacing="1">EST. 2024</text>
    <path d="M-60 15 L-20 15 M20 15 L60 15" fill="none" stroke="url(#badgeGold)" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>