<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#0A0A0B"/>
  <g id="arc-segments">
    <!-- Outer arc: 270° in green -->
    <path d="M 50 15 A 35 35 0 1 1 15 50" fill="none" stroke="#00E859" stroke-width="4" stroke-linecap="round"/>
    <!-- Inner arc: 180° rotated, in gold -->
    <path d="M 72 50 A 22 22 0 1 1 28 50" fill="none" stroke="#C8A951" stroke-width="3" stroke-linecap="round"/>
    <!-- Stitch detail: small dashes on inner arc -->
    <path d="M 72 50 A 22 22 0 0 1 62 32" fill="none" stroke="#0A0A0B" stroke-width="1.5" stroke-dasharray="2 4"/>
    <!-- Center dot -->
    <circle cx="50" cy="50" r="3" fill="#00E859"/>
  </g>
</svg>
