<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#0A0A0B"/>
  <g id="wave-stitch">
    <!-- Three overlapping waves: jersey fabric in motion -->
    <path d="M 15 50 Q 30 32, 50 50 T 85 50" fill="none" stroke="#00E859" stroke-width="3" stroke-linecap="round"/>
    <path d="M 15 50 Q 30 40, 50 50 T 85 50" fill="none" stroke="#00E859" stroke-width="2" stroke-linecap="round" opacity="0.5" transform="translate(0, -7)"/>
    <path d="M 15 50 Q 30 44, 50 50 T 85 50" fill="none" stroke="#00E859" stroke-width="2" stroke-linecap="round" opacity="0.35" transform="translate(0, 7)"/>
    <!-- Gold stitch crossing the waves = repair -->
    <line x1="20" y1="68" x2="80" y2="32" stroke="#C8A951" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="68" x2="80" y2="32" stroke="#0A0A0B" stroke-width="1.2" stroke-dasharray="2 4" opacity="0.5"/>
    <!-- Anchor dots -->
    <circle cx="15" cy="50" r="2.5" fill="#00E859"/>
    <circle cx="85" cy="50" r="2.5" fill="#00E859"/>
  </g>
</svg>
