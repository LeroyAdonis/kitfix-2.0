<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#0A0A0B"/>
  <g id="infinity-loop">
    <!-- A single smooth path forming a stitch-infinity hybrid -->
    <path d="M 30 50 C 30 30, 50 30, 50 50 C 50 70, 70 70, 70 50 C 70 30, 50 30, 50 50 C 50 70, 30 70, 30 50 Z"
          fill="none" stroke="#00E859" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Thread-like detail tracing the path -->
    <path d="M 30 50 C 30 30, 50 30, 50 50 C 50 70, 70 70, 70 50 C 70 30, 50 30, 50 50 C 50 70, 30 70, 30 50 Z"
          fill="none" stroke="#C8A951" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6"/>
    <!-- Small needle eye at top -->
    <ellipse cx="50" cy="23" rx="3" ry="5" fill="none" stroke="#00E859" stroke-width="1.5" transform="rotate(-30 50 23)"/>
  </g>
</svg>
