<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#0A0A0B"/>
  <g id="punched-circle">
    <!-- Solid green circle -->
    <circle cx="50" cy="50" r="36" fill="#00E859"/>
    <!-- Asymmetric perforation: stitch slit cut from circle -->
    <rect x="30" y="48" width="12" height="4" rx="2" fill="#0A0A0B"/>
    <rect x="46" y="48" width="8" height="4" rx="2" fill="#0A0A0B"/>
    <rect x="58" y="48" width="12" height="4" rx="2" fill="#0A0A0B"/>
    <!-- Gold accent: needle tip entering from top-right -->
    <circle cx="68" cy="32" r="3" fill="#C8A951"/>
  </g>
</svg>
