<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#0A0A0B"/>
  <g id="dot-matrix">
    <!-- Sparse dot matrix forming a subtle K -->
    <circle cx="20" cy="20" r="3" fill="#00E859" opacity="0.3"/>
    <circle cx="35" cy="20" r="2" fill="#C8A951" opacity="0.4"/>
    <circle cx="50" cy="20" r="4" fill="#00E859"/>
    <circle cx="65" cy="20" r="2" fill="#C8A951" opacity="0.4"/>
    <circle cx="80" cy="20" r="3" fill="#00E859" opacity="0.3"/>
    <circle cx="20" cy="35" r="2" fill="#C8A951" opacity="0.4"/>
    <circle cx="35" cy="35" r="3" fill="#00E859" opacity="0.5"/>
    <circle cx="50" cy="35" r="3" fill="#00E859"/>
    <circle cx="65" cy="35" r="5" fill="#00E859"/>
    <circle cx="80" cy="35" r="2" fill="#C8A951" opacity="0.4"/>
    <circle cx="20" cy="50" r="3" fill="#00E859"/>
    <circle cx="35" cy="50" r="2" fill="#C8A951"/>
    <circle cx="50" cy="50" r="2" fill="#C8A951" opacity="0.5"/>
    <circle cx="65" cy="50" r="3" fill="#00E859" opacity="0.5"/>
    <circle cx="80" cy="50" r="3" fill="#00E859" opacity="0.3"/>
    <circle cx="20" cy="65" r="2" fill="#C8A951" opacity="0.4"/>
    <circle cx="35" cy="65" r="3" fill="#00E859" opacity="0.5"/>
    <circle cx="50" cy="65" r="3" fill="#00E859"/>
    <circle cx="65" cy="65" r="2" fill="#C8A951" opacity="0.4"/>
    <circle cx="80" cy="65" r="4" fill="#00E859"/>
    <circle cx="20" cy="80" r="3" fill="#00E859" opacity="0.3"/>
    <circle cx="35" cy="80" r="2" fill="#C8A951" opacity="0.4"/>
    <circle cx="50" cy="80" r="4" fill="#00E859"/>
    <circle cx="65" cy="80" r="3" fill="#00E859" opacity="0.3"/>
    <circle cx="80" cy="80" r="2" fill="#C8A951" opacity="0.4"/>
    <!-- Gold anchor dots forming the stitch line -->
    <circle cx="35" cy="35" r="4" fill="#C8A951"/>
    <circle cx="65" cy="35" r="4" fill="#C8A951"/>
    <circle cx="35" cy="65" r="4" fill="#C8A951"/>
    <circle cx="65" cy="65" r="4" fill="#C8A951"/>
  </g>
</svg>
