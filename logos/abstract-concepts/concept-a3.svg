<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#0A0A0B"/>
  <g id="radial-burst">
    <!-- 8 rays from center, alternating lengths -->
    <line x1="50" y1="50" x2="50" y2="10" stroke="#00E859" stroke-width="3" stroke-linecap="round"/>
    <line x1="50" y1="50" x2="85" y2="15" stroke="#C8A951" stroke-width="2" stroke-linecap="round"/>
    <line x1="50" y1="50" x2="90" y2="50" stroke="#00E859" stroke-width="3" stroke-linecap="round"/>
    <line x1="50" y1="50" x2="85" y2="85" stroke="#C8A951" stroke-width="2" stroke-linecap="round"/>
    <line x1="50" y1="50" x2="50" y2="90" stroke="#00E859" stroke-width="3" stroke-linecap="round"/>
    <line x1="50" y1="50" x2="15" y2="85" stroke="#C8A951" stroke-width="2" stroke-linecap="round"/>
    <line x1="50" y1="50" x2="10" y2="50" stroke="#00E859" stroke-width="3" stroke-linecap="round"/>
    <line x1="50" y1="50" x2="15" y2="15" stroke="#C8A951" stroke-width="2" stroke-linecap="round"/>
    <!-- Negative space K in center -->
    <path d="M 44 44 L 44 56" stroke="#0A0A0B" stroke-width="5" stroke-linecap="round"/>
    <path d="M 44 44 L 54 38" stroke="#0A0A0B" stroke-width="5" stroke-linecap="round"/>
    <path d="M 44 50 L 56 56" stroke="#0A0A0B" stroke-width="5" stroke-linecap="round"/>
    <!-- Center dot -->
    <circle cx="50" cy="50" r="3" fill="#00E859"/>
  </g>
</svg>
