<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <clipPath id="circle-mask-b3">
      <circle cx="50" cy="50" r="32"/>
    </clipPath>
  </defs>
  <rect width="100" height="100" fill="#0A0A0B"/>
  <g id="line-fill-circle">
    <!-- Horizontal lines clipped to circle, varying weight = jersey fabric texture -->
    <g clip-path="url(#circle-mask-b3)" stroke="#00E859" stroke-linecap="round">
      <line x1="15" y1="24" x2="85" y2="24" stroke-width="2"/>
      <line x1="15" y1="31" x2="85" y2="31" stroke-width="2.5"/>
      <line x1="15" y1="38" x2="85" y2="38" stroke-width="2"/>
      <line x1="15" y1="45" x2="85" y2="45" stroke-width="3"/>
      <line x1="15" y1="52" x2="85" y2="52" stroke-width="2.5"/>
      <line x1="15" y1="59" x2="85" y2="59" stroke-width="2"/>
      <line x1="15" y1="66" x2="85" y2="66" stroke-width="2.5"/>
      <line x1="15" y1="73" x2="85" y2="73" stroke-width="2"/>
    </g>
    <!-- Gold stitch diagonal cutting across the fabric -->
    <line x1="25" y1="70" x2="75" y2="30" stroke="#C8A951" stroke-width="3.5" stroke-linecap="round" clip-path="url(#circle-mask-b3)"/>
    <!-- Dashed stitch detail on gold line -->
    <line x1="25" y1="70" x2="75" y2="30" stroke="#0A0A0B" stroke-width="1.5" stroke-dasharray="3 5" clip-path="url(#circle-mask-b3)"/>
    <!-- Outer thin ring -->
    <circle cx="50" cy="50" r="36" fill="none" stroke="#00E859" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.4"/>
  </g>
</svg>
