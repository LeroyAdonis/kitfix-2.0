<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#0A0A0B"/>
  <g id="line-system">
    <!-- Dense vertical lines, gold diagonal cut = jersey stitch -->
    <line x1="20" y1="15" x2="20" y2="85" stroke="#00E859" stroke-width="2" opacity="0.9"/>
    <line x1="28" y1="15" x2="28" y2="85" stroke="#00E859" stroke-width="2" opacity="0.8"/>
    <line x1="36" y1="15" x2="36" y2="85" stroke="#00E859" stroke-width="2" opacity="0.9"/>
    <line x1="44" y1="15" x2="44" y2="85" stroke="#00E859" stroke-width="2" opacity="0.7"/>
    <line x1="52" y1="15" x2="52" y2="85" stroke="#00E859" stroke-width="2" opacity="0.9"/>
    <line x1="60" y1="15" x2="60" y2="85" stroke="#00E859" stroke-width="2" opacity="0.8"/>
    <line x1="68" y1="15" x2="68" y2="85" stroke="#00E859" stroke-width="2" opacity="0.9"/>
    <line x1="76" y1="15" x2="76" y2="85" stroke="#00E859" stroke-width="2" opacity="0.7"/>
    <line x1="84" y1="15" x2="84" y2="85" stroke="#00E859" stroke-width="2" opacity="0.9"/>
    <!-- Gold stitch diagonal cutting through -->
    <line x1="20" y1="85" x2="84" y2="20" stroke="#C8A951" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <!-- Dashed stitch detail on the gold line -->
    <line x1="20" y1="85" x2="84" y2="20" stroke="#0A0A0B" stroke-width="1.5" stroke-dasharray="3 5" opacity="0.6"/>
  </g>
</svg>
