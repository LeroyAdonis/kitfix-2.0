<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#0A0A0B"/>
  <g id="spiral-rebirth">
    <!-- Fibonacci-ish spiral = growth, rebirth, life returning -->
    <path d="M 50 50 A 5 5 0 0 1 55 50 A 8 8 0 0 1 55 58 A 13 13 0 0 1 42 58 A 21 21 0 0 1 42 37 A 34 34 0 0 1 76 37"
          fill="none" stroke="#00E859" stroke-width="3" stroke-linecap="round"/>
    <!-- Gold dot at spiral origin = the seed/heart of restoration -->
    <circle cx="50" cy="50" r="2.5" fill="#C8A951"/>
    <!-- Asymmetric: tiny green dot at outer edge = growth reaching out -->
    <circle cx="76" cy="37" r="2" fill="#00E859" opacity="0.6"/>
  </g>
</svg>
