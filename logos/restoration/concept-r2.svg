<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#0A0A0B"/>
  <g id="restoration-wave">
    <!-- Three flowing waves = jersey fabric breathing again -->
    <path d="M 15 45 Q 28 28, 50 45 T 85 45" fill="none" stroke="#00E859" stroke-width="3" stroke-linecap="round"/>
    <path d="M 15 52 Q 28 38, 50 52 T 85 52" fill="none" stroke="#00E859" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M 15 59 Q 28 48, 50 59 T 85 59" fill="none" stroke="#00E859" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
    <!-- Gold thread flowing through the waves = the restoration -->
    <path d="M 20 65 Q 35 35, 50 50 T 80 38" fill="none" stroke="#C8A951" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 5"/>
    <!-- Anchor points -->
    <circle cx="15" cy="45" r="2" fill="#00E859"/>
    <circle cx="85" cy="45" r="2" fill="#00E859"/>
    <circle cx="50" cy="50" r="1.5" fill="#C8A951"/>
  </g>
</svg>
