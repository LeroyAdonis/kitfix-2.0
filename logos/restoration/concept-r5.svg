<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#0A0A0B"/>
  <g id="organic-dot-matrix">
    <!-- Organic capsule dots flowing along a restoration arc -->
    <rect x="20" y="62" width="14" height="6" rx="3" fill="#00E859" transform="rotate(-50, 27, 65)" opacity="0.5"/>
    <rect x="28" y="50" width="16" height="7" rx="3.5" fill="#00E859" transform="rotate(-30, 36, 53.5)" opacity="0.7"/>
    <rect x="40" y="42" width="18" height="8" rx="4" fill="#00E859" transform="rotate(-10, 49, 46)"/>
    <rect x="56" y="40" width="18" height="8" rx="4" fill="#00E859" transform="rotate(10, 65, 44)"/>
    <rect x="70" y="44" width="16" height="7" rx="3.5" fill="#00E859" transform="rotate(30, 78, 47.5)" opacity="0.7"/>
    <rect x="78" y="52" width="14" height="6" rx="3" fill="#00E859" transform="rotate(50, 85, 55)" opacity="0.5"/>
    <!-- Gold capsule at center of arc = the restoration moment -->
    <rect x="46" y="33" width="20" height="9" rx="4.5" fill="#C8A951" transform="rotate(-2, 56, 37.5)"/>
  </g>
</svg>
