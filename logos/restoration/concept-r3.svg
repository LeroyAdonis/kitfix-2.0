<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#0A0A0B"/>
  <g id="infinity-restore">
    <!-- Single continuous path: the cycle of restoration -->
    <path d="M 25 50 C 25 32, 42 32, 50 50 C 58 68, 75 68, 75 50 C 75 32, 58 32, 50 50 C 42 68, 25 68, 25 50 Z"
          fill="none" stroke="#00E859" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Gold thread tracing part of the path = the repair within the cycle -->
    <path d="M 25 50 C 25 32, 42 32, 50 50"
          fill="none" stroke="#C8A951" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 4" opacity="0.8"/>
    <path d="M 50 50 C 58 68, 75 68, 75 50"
          fill="none" stroke="#C8A951" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 4" opacity="0.8"/>
  </g>
</svg>
